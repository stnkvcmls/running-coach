services:
  running-coach:
    image: ghcr.io/stnkvcmls/running-coach:latest
    container_name: running-coach
    ports:
      # Loopback-only by default: put a reverse proxy or Cloudflare Tunnel in front, or change to "8080:8000" deliberately.
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data:/data
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TIMEZONE=${TIMEZONE:-UTC}
      - DB_PATH=${DB_PATH:-/data/running_coach.db}
      - GARMIN_TOKEN_DIR=${GARMIN_TOKEN_DIR:-/data/garmin_tokens}
      - ACTIVITY_POLL_MINUTES=${ACTIVITY_POLL_MINUTES:-5}
      - CALENDAR_SYNC_HOURS=${CALENDAR_SYNC_HOURS:-6}
      - DAILY_SYNC_HOUR=${DAILY_SYNC_HOUR:-7}
      - AUTO_ANALYZE_ACTIVITIES=${AUTO_ANALYZE_ACTIVITIES:-true}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-6}
      # Auth / multi-user (Phase 1+). ENCRYPTION_KEY is required to store
      # per-user Garmin credentials (Phase 2); keep it stable and backed up.
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - DEV_USER_EMAIL=${DEV_USER_EMAIL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Must match the in-container bind so the startup guard sees it.
      - BIND_HOST=0.0.0.0
      - ALLOW_INSECURE_BIND=${ALLOW_INSECURE_BIND:-false}
    # Opt this container in so Watchtower only updates running-coach, not every container on the host.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/', timeout=5)\""]
      interval: 60s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      # Only update containers opted in via com.centurylinklabs.watchtower.enable=true.
      - WATCHTOWER_LABEL_ENABLE=true
    restart: unless-stopped
