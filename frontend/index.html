<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <title>Running Coach</title>
  </head>
  <body>
    <script>
      // Pre-paint theme, mirroring src/hooks/useThemePreference.ts: the stored
      // 'light' | 'dark' is an explicit choice; 'system' (or nothing stored)
      // follows prefers-color-scheme, falling back to dark without matchMedia.
      (function() {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' &&
          (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
